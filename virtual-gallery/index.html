<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>虛擬策展工作室｜線上美術館</title
  ><link rel="stylesheet" href="style.css" />
  <header>
    <strong>虛擬策展工作室</strong>
    <nav><a href="#exhibits">展覽</a><a href="#works">典藏作品</a></nav>
  </header>
  <main>
    <section id="exhibits">
      <div class="row">
        <label>展覽選擇<select id="shows"></select></label>
      </div>
    </section>
    <article class="hero" hidden>
      <img src="media/hero.webp" alt="展覽空間" />
      <div>
        <p id="dates"></p>
        <h1 id="title"></h1>
        <p id="desc"></p>
        <button id="enter">進入 3D 展廳</button>
      </div>
    </article>
    <section id="visit" aria-label="3D 展廳">
      <div class="row">
        <h1 id="visitTitle">3D 展廳</h1>
        <select id="room" aria-label="展廳"></select
        ><button id="next">下一件導覽</button
        ><button id="leave">展覽介紹</button>
      </div>
      <p>拖曳環顧，方向鍵或下方按鍵移動。點選作品可閱讀展籤。</p>
      <div id="stage" aria-label="可行走的 3D 展廳">正在開啟 3D 展廳…</div>
      <label id="musicLabel">展廳音樂<audio id="music" controls></audio></label
      ><label id="volLabel"
        >播放音量<input
          id="vol"
          type="range"
          min="0"
          max="1"
          step=".01"
          value=".5"
      /></label>
    </section>
    <div id="works" class="section">
      <h2>展出作品</h2>
      <span id="count"></span>
    </div>
    <div class="grid" id="cards"></div>
  </main>
  <footer>
    虛擬策展工作室　線上美術館　·　<a href="admin/">線上策展後台</a>　·　<a
      href="studio.zip"
      download
      >下載策展工作室</a
    >
  </footer>
  <dialog id="detail">
    <button id="close">關閉展籤</button>
    <section id="content"></section>
  </dialog>
  <script type="module" src="app.js"></script>
</html>
