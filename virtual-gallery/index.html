<!doctype html>
<html lang="zh-Hant">
  <link rel="icon" type="image/webp" href="media/art1.webp" />
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><title>水墨畫展廳｜虛擬策展工作室</title
  ><link rel="stylesheet" href="style.css?v=scroll3" />
  <header>
    <strong>虛擬策展工作室</strong>
    <nav><a href="#exhibits">展覽</a><a href="#works">典藏作品</a></nav>
  </header>
  <main>
    <section id="exhibits">
      <div class="row">
        <label>展覽選擇<select id="shows"></select></label>
      </div>
    </section>
    <article class="hero" hidden>
      <img src="media/hero.webp" alt="展覽空間" />
      <div>
        <p id="dates"></p>
        <h1 id="title"></h1>
        <p id="desc"></p>
        <button id="enter">進入 3D 展廳</button>
      </div>
    </article>
    <section id="visit" class="immersive" aria-label="3D 展廳">
      <div id="stage" aria-label="可行走的 3D 展廳">正在開啟 3D 展廳…</div>
      <div class="museum-head">
        <h1 id="visitTitle">水墨畫展廳</h1>
        <button id="expand">全螢幕</button
        ><button
          id="menuButton"
          aria-expanded="false"
          aria-controls="visitMenu"
        >
          選單
        </button>
      </div>
      <div class="view-caption">
        <strong id="focusTitle" aria-live="polite"></strong
        ><span id="viewHelp">點作品走近觀賞 · 拖曳環顧</span>
      </div>
      <div id="visitMenu" hidden>
        <label>切換展覽<select id="visitShows"></select></label>
        <label>展廳<select id="room"></select></label>
        <div class="tour-tools">
          <button id="prev">上一件</button
          ><select id="tour" aria-label="選擇導覽作品"></select
          ><button id="next">下一件</button>
        </div>
        <div class="tour-tools">
          <button id="homeView">回到入口</button
          ><button id="leave">展覽介紹與作品清單</button>
        </div>
        <label id="musicLabel"
          >展廳音樂<audio id="music" controls></audio></label
        ><label id="volLabel"
          >播放音量<input
            id="vol"
            type="range"
            min="0"
            max="1"
            step=".01"
            value=".5"
        /></label>
      </div>
    </section>
    <div id="works" class="section">
      <h2>展出作品</h2>
      <span id="count"></span>
    </div>
    <div class="grid" id="cards"></div>
  </main>
  <footer>
    虛擬策展工作室　線上美術館　·　<a href="admin/">線上策展後台</a>　·　<a
      href="studio.zip"
      download
      >下載策展工作室</a
    >
  </footer>
  <dialog id="detail">
    <button id="close">關閉展籤</button>
    <section id="content"></section>
  </dialog>
  <script type="module" src="app.js?v=scroll3"></script>
</html>
