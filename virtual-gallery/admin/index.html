<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>虛擬策展工作室｜管理後台</title
  ><meta name="referrer" content="no-referrer" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com https://api.github.com 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
  />
  <style>
    #preview {box-sizing:border-box;width:min(98vw,1500px);height:94dvh;max-height:98dvh;padding:0;border:0;border-radius:8px;background:#f4f6f7}
    #preview[open]{display:grid;grid-template-rows:auto minmax(0,1fr)}
    #preview::backdrop{background:#122336b3}
    .preview-heading{display:flex;align-items:center;gap:.7rem;padding:.4rem .65rem;color:#19364e}
    #closePreview{min-height:44px;flex:none}#previewTitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #preview iframe{width:100%;height:100%;min-height:0;border:0}
    #login {
      max-width: 600px;
      margin: 6vh auto;
      padding: 24px;
      background: white;
    }
    #login p {
      line-height: 1.7;
    }
    #login .remember-choice{display:flex;align-items:center;gap:.55rem;min-height:44px}
    #login #remember-device{width:1.2rem;height:1.2rem;margin:0;accent-color:#19364e}
    #login input {
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
    }
    body {
      font: 16px system-ui;
      color: #1b3448;
      margin: 0;
      background: #f4f6f7;
    }
    header,
    main {
      max-width: 1300px;
      margin: auto;
      padding: 18px 4vw;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      padding: 10px;
      border: 1px solid #bcc8cd;
      border-radius: 5px;
      color: inherit;
      background: white;
    }
    button {
      cursor: pointer;
    }
    button[aria-current="true"],
    .action {
      background: #19364e;
      color: white;
    }
    nav,
    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0;
    }
    label {
      display: grid;
      gap: 4px;
      font-size: 14px;
    }
    fieldset {
      border: 1px solid #cdd6da;
      background: #fff;
      margin: 16px 0;
      padding: 14px;
    }
    legend {
      font-weight: bold;
    }
    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
      gap: 12px;
    }
    input,
    select,
    textarea {
      min-width: 0;
      max-width: 100%;
    }
    .panel {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) minmax(0, 3fr);
      gap: 20px;
    }
    aside button {
      width: 100%;
      text-align: left;
      margin: 3px 0;
    }
    .wall {
      position: relative;
      aspect-ratio: 12/4.5;
      background:
        repeating-linear-gradient(0deg, #d9e0e1 0 1px, transparent 1px 11.11%),
        repeating-linear-gradient(90deg, #dae0e3 0 1px, #f7f8f8 1px 8.333%);
      border: 1px solid #84939a;
      overflow: hidden;
    }
    .piece {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 0;
      touch-action: none;
      overflow: hidden;
      background: #a2b9be;
      background-size: 100% 100%;
      border: 3px solid #76664f;
    }
    .piece.sel {
      outline: 3px solid #20689b;
    }
    .piece span {
      background: #fff9;
      font-size: 12px;
    }
    #stage {
      position: relative;
      height: 52dvh;
      min-height: 250px;
    }
    #stage canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .pad {
      position: absolute;
      bottom: 7px;
      left: 7px;
    }
    .pad button {
      touch-action: none;
    }
    a {
      color: inherit;
    }
    #status {
      max-width: 50%;
      font-size: 14px;
    }
    video,
    img {
      max-width: 100%;
    }
    @media (max-width: 680px) {
      .panel {
        display: block;
      }
      aside {
        max-height: 185px;
        overflow: auto;
      }
      .fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .wall {
        min-height: 180px;
      }
      header {
        padding: 12px;
      }
      h1 {
        font-size: 26px;
      }
    }
    .art-library button {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      width: 100%;
      margin: 3px 0;
    }
    .art-thumb {
      width: 68px;
      height: 54px;
      object-fit: cover;
      flex: none;
      border-radius: 3px;
      background: #e3e7e8;
      color: #314756;
      overflow: hidden;
      align-content: center;
      text-align: center;
    }
    .art-library small {
      display: block;
      font-size: 12px;
      margin-top: 4px;
    }
    .art-library strong {
      overflow-wrap: anywhere;
    }
    #art-preview {
      display: grid;
      place-items: center;
      background: #e9edec;
      border-radius: 6px;
      padding: 12px;
    }
    .art-large {
      display: block;
      max-width: 100%;
      max-height: 44vh;
      object-fit: contain;
      white-space: pre-wrap;
    }
    .art-library {
      max-height: 65vh;
      overflow: auto;
    }
    @media (max-width: 680px) {
      .art-library {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        max-height: 260px;
      }
      .art-library button {
        display: grid;
        align-content: start;
        padding: 5px;
      }
      .art-thumb {
        width: 100%;
        height: 76px;
      }
      .art-large {
        max-height: 32vh;
      }
    }
    .walk-stick {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #24384780;
      touch-action: none;
    }
    .walk-knob {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
    }

#stage .camera-keys {display:grid;grid-template-columns:repeat(4,44px);gap:2px;position:absolute;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2}
#stage .camera-keys button{padding:0;min-height:44px;border:1px solid #ffffff50;border-radius:5px;background:#20302ee6;color:white;font:14px system-ui;touch-action:none;user-select:none;-webkit-user-select:none}
#stage .camera-keys button.pressed{background:#51695d;border-color:white}

.camera-keys kbd{display:none}#stage .camera-keys button.key-down{background:#51695d;border-color:white}
@media (hover:hover) and (pointer:fine){.camera-keys kbd{display:block;font:11px/1.2 system-ui;color:#d6e3db}}
#stage{height:clamp(340px,66dvh,820px);overflow:hidden;background:#26302e}
    .wall-readout:not([hidden]){display:block;padding:.65rem .85rem;background:#eef2f0;color:#16352e;font:500 .9rem/1.7 system-ui;font-variant-numeric:tabular-nums}
    .panel-members{display:flex;flex-wrap:wrap;gap:.2rem 1rem}.panel-members label{display:inline-flex;align-items:center;gap:.35rem;min-height:44px}.panel-members input{width:auto;min-height:0}
    .hanging-desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(275px,32%);gap:16px;height:min(82dvh,900px);align-items:start}
    #wall-preview{min-width:0;display:flex;flex-direction:column;background:white;border:1px solid #bdc9ce;border-radius:7px;overflow:hidden}
    #surface{min-width:0}#surface p{margin:.4rem}
    .surface-tools,.pad-caption{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .surface-tools{padding:3px 8px;font-size:.85rem}.surface-tools strong{margin-right:auto}.surface-tools button{min-height:36px;padding:3px 8px}
    #wall-preview{--preview-height:clamp(150px,calc(80dvh - 175px),710px)}
    #surface #stage{height:var(--preview-height);min-height:0}
    #surface .wall{width:min(100%,calc(var(--preview-height) * var(--wall-ratio)));box-sizing:border-box;margin:auto}
    .pinch-tip,.wheel-tip{display:none;font-weight:normal}
    @media(any-pointer:coarse){.pinch-tip{display:inline}}
    @media(any-pointer:fine){.wheel-tip{display:inline}.pinch-tip{display:none}}
    .stage-loading{position:absolute;inset:0;display:grid;place-items:center;color:white}
    #surface .wall-readout:not([hidden]){max-height:3.4em;overflow:auto;padding:4px 8px;font-size:12px;line-height:1.5}
    #position-pad{padding:6px 8px 8px;border-top:1px solid #d2dcdf}.pad-caption{font-size:.85rem;margin-bottom:5px}
    .pad-caption strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pad-caption span{white-space:nowrap}
    .nudge-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.nudge-keys button{min-height:44px;padding:4px;touch-action:manipulation}
    #layout-inspector{min-width:0;min-height:0;max-height:100%;overflow:auto;scrollbar-gutter:stable}
    #layout-inspector fieldset{min-width:0}.inventory{padding:10px;background:white;border:1px solid #d3dbdd;border-radius:6px}
    .inventory h2{font-size:1rem;margin:0}#wall-progress{font-size:.85rem;margin:.4rem 0;color:#425968}
    #wall-list{max-height:none;overflow:visible}#wall-list button{min-height:44px}#wall-list .art-thumb{object-fit:contain}
    @media(max-width:760px) and (orientation:portrait){
      .hanging-desk{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:calc(100dvh - 12px);gap:8px}
      #wall-preview{--preview-height:36dvh}#layout-inspector{height:100%;box-sizing:border-box}
      #wall-list{display:flex;gap:6px;overflow:auto}#wall-list button{flex:0 0 140px;display:flex;padding:5px}
      #wall-list .art-thumb{width:38px;height:48px}#wall-list small{font-size:11px}
    }
    @media(orientation:landscape) and (max-height:540px){
      .hanging-desk{height:94dvh;grid-template-columns:minmax(0,1.4fr) minmax(210px,1fr);gap:8px}
      #wall-preview{--preview-height:max(90px,calc(93dvh - 160px))}
    }
    .live-exhibition{display:inline-flex;align-items:center;padding:8px;color:#174866;text-underline-offset:.2em}
    .wall-save{display:flex;align-items:center;gap:6px;min-height:20px;padding:2px 8px;color:#465a65;font-size:12px}
    [data-save-retry]:not([hidden]){border-color:#8b4931;color:#793c28;background:#fff7ee}
    .wall-save button{flex:none;padding:4px 8px}

    #mount-controls{border-top:3px solid #536c77;border-radius:4px;scroll-margin:8px}
    #mount-controls [hidden]{display:none!important}
    .mount-section+.mount-section{margin-top:1rem;border-top:1px solid #dde3e4;padding-top:.85rem}
    .mount-size-readout{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;background:#eaf0f1;color:#203e4c;border-bottom:1px solid #b9c9ce;margin:0 0 12px;padding:6px 8px;font:500 .8rem/1.5 system-ui;font-variant-numeric:tabular-nums}
    .mount-size-readout span{white-space:nowrap}
    .mount-section h3{font-size:.88rem;margin:0 0 .55rem;color:#344b59}
    .mount-grid,.mount-palettes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .mount-grid label{font-size:.82rem;align-content:start}
    .mount-grid :is(input,select){width:100%;min-height:44px;box-sizing:border-box}
    .mount-grid input[type=color]{padding:3px}
    .mount-grid input[type=range]{padding:0;accent-color:#234963}
    .mount-grid label:has(output){position:relative}
    .mount-grid output{position:absolute;right:0;top:0;font-variant-numeric:tabular-nums}
    .mount-palettes{margin-bottom:10px}
    .mount-palette{display:flex;align-items:center;gap:7px;min-height:44px;font-size:13px;text-align:left;padding:5px}
    .mount-palette[aria-pressed=true]{border-color:#28506b;box-shadow:inset 0 0 0 1px #28506b}
    .mount-chips{display:flex;flex:none;overflow:hidden;border:1px solid #0003;border-radius:3px}
    .mount-chips i{display:block;width:7px;height:19px}
    .mount-recipe-picker{display:grid;gap:5px;margin:0 0 14px}
    .mount-recipe-picker :is(select,button){max-width:100%;min-height:44px}
    .mount-recipe-picker button{justify-self:start}
    .box-example .frame-slice{width:27%;height:23px;position:absolute;left:11%}
    .box-example-backing{position:absolute;left:17%;right:11%;height:18px;border-top:1px solid #7f9ca4;border-bottom:3px solid #978776}
    .box-example-backing::after{content:"";position:absolute;left:22%;right:1%;bottom:3px;border-bottom:2px solid #aa7954}
    .mount-samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
    .mount-samples button{display:grid;gap:3px;padding:4px;min-height:51px;justify-items:center;font-size:13px}
    .mount-samples button[aria-pressed=true]{background:#edf3f3;border-color:#34576b;box-shadow:inset 0 0 0 1px #34576b}
    #mount-controls button:focus-visible{outline:3px solid #2878a9;outline-offset:2px}
    .mount-example{position:relative;display:grid;place-items:center;width:100%;height:28px}
    .frame-slice{width:76%;height:19px;background:linear-gradient(115deg,#ae8863,#70523c)}
    [data-sample-key=scrollStyle] .mount-example{height:58px}
    [data-sample-key=albumStyle] .mount-example{height:58px}
    .album-sample{position:absolute;display:block;transform:translate(-50%,-50%)}
    .mount-ratio{min-height:44px;margin-top:8px}
    [data-sample-key=handscrollStyle] .mount-example{height:30px}
    .handscroll-sample{display:block;position:relative;width:50%;height:10px}
    .handscroll-sample .paper-sample::after{left:16%;width:65%;top:40%;height:0;border:0;border-top:1px dashed #736a57}
    .scroll-sample{display:block;position:absolute;top:53%;left:50%;width:16px;height:26px;transform:translate(-50%,-50%)}
    .paper-sample{display:block;position:absolute;inset:0;background:#f3eadd}
    .paper-sample::after{content:"";position:absolute;top:18%;height:64%;left:45%;border-left:1px dashed #736a57}
    .mount-section details>summary{cursor:pointer;min-height:44px;align-content:center}
    .mount-section details>div>button{margin:6px 0 10px}
    .mount-restore{min-height:44px;margin-top:6px}
    .wall button.piece{border:0;overflow:visible;border-radius:0;background:transparent}
    .plan-face,.plan-mount,.plan-mount i{display:block;position:absolute;pointer-events:none}
    .plan-face,.plan-mount{inset:0}
    .plan-face{background:#a2b9be center / 100% 100% no-repeat}
    .piece .plan-label{display:none;position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#183344;color:white;padding:2px 4px;border-radius:3px;font-size:11px;pointer-events:none}
    .piece:focus-visible{z-index:1}.piece:focus-visible .plan-label{display:block}
    @media(hover:hover){.piece:hover{z-index:1}.piece:hover .plan-label{display:block}}
    @media(max-width:400px){.surface-tools{gap:3px}.surface-tools button{font-size:.8rem;padding:3px 5px}}
  </style>
  <link rel="stylesheet" href="./workspace.css?v=desk33">
  <link rel="stylesheet" href="./catalog-desk.css?v=desk33">
  <link rel="stylesheet" href="./desk-panels.css?v=desk33">
  <link rel="stylesheet" href="../typography.css?v=hall34">
  <header class="studio-header">
    <strong class="studio-brand"><i class="studio-emblem" aria-hidden="true"></i>虛擬策展工作室</strong>
    <span id="status" role="status">正在開啟策展後台…</span><button data-save-retry hidden>重試儲存</button>
    <a class="gallery-return" href="../" target="_blank" rel="noopener">展廳入口</a>
    <button id="logout" hidden>登出</button>
  </header>
  <main>
    <div id="login">
      <h1>登入策展工作室</h1>
      <p>以策展帳號開啟私人作品庫與展覽。</p>
      <label class="remember-choice"><input id="remember-device" type="checkbox" checked>在這台裝置保持登入 30 天</label>
      <button id="account" class="action" disabled>使用 GitHub 帳號登入</button>

      <details>
        <summary>擁有者設定與備援登入</summary>
        <p><a href="./register.html">設定 GitHub 登入應用程式</a></p>
        <label
          >既有 GitHub 管理憑證<input
            id="key"
            type="password"
            autocomplete="off"
            spellcheck="false" /></label
        ><button id="signin" disabled>使用既有憑證登入</button>
      </details>
    </div>
    <nav id="tabs" aria-label="工作室主選單"></nav>
    <div id="app"></div>
  </main>
  <dialog id="preview" aria-label="參觀預覽">
    <div class="preview-heading"><button id="closePreview">返回佈展</button><strong id="previewTitle"></strong></div>
    <iframe title="草稿預覽" allowfullscreen></iframe>
  </dialog>
  <script type="module" src="./login.js?v=glazing63"></script>
</html>
