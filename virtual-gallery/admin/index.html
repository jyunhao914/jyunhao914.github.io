<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>虛擬策展工作室｜管理後台</title
  ><meta name="referrer" content="no-referrer" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com https://api.github.com 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
  />
  <style>
    #preview {
      width: 95vw;
      height: 90dvh;
      border: 0;
    }
    #preview iframe {
      width: 100%;
      height: 90%;
      border: 0;
    }
    #login {
      max-width: 600px;
      margin: 6vh auto;
      padding: 24px;
      background: white;
    }
    #login p {
      line-height: 1.7;
    }
    #login input {
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
    }
    body {
      font: 16px system-ui;
      color: #1b3448;
      margin: 0;
      background: #f4f6f7;
    }
    header,
    main {
      max-width: 1300px;
      margin: auto;
      padding: 18px 4vw;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      padding: 10px;
      border: 1px solid #bcc8cd;
      border-radius: 5px;
      color: inherit;
      background: white;
    }
    button {
      cursor: pointer;
    }
    button[aria-current="true"],
    .action {
      background: #19364e;
      color: white;
    }
    nav,
    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0;
    }
    label {
      display: grid;
      gap: 4px;
      font-size: 14px;
    }
    fieldset {
      border: 1px solid #cdd6da;
      background: #fff;
      margin: 16px 0;
      padding: 14px;
    }
    legend {
      font-weight: bold;
    }
    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
      gap: 12px;
    }
    input,
    select,
    textarea {
      min-width: 0;
      max-width: 100%;
    }
    .panel {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) minmax(0, 3fr);
      gap: 20px;
    }
    aside button {
      width: 100%;
      text-align: left;
      margin: 3px 0;
    }
    .wall {
      position: relative;
      aspect-ratio: 12/4.5;
      background:
        repeating-linear-gradient(0deg, #d9e0e1 0 1px, transparent 1px 11.11%),
        repeating-linear-gradient(90deg, #dae0e3 0 1px, #f7f8f8 1px 8.333%);
      border: 1px solid #84939a;
      overflow: hidden;
    }
    .piece {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 0;
      touch-action: none;
      overflow: hidden;
      background: #a2b9be;
      background-size: 100% 100%;
      border: 3px solid #76664f;
    }
    .piece.sel {
      outline: 3px solid #20689b;
    }
    .piece span {
      background: #fff9;
      font-size: 12px;
    }
    #stage {
      position: relative;
      height: 52dvh;
      min-height: 250px;
    }
    #stage canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .pad {
      position: absolute;
      bottom: 7px;
      left: 7px;
    }
    .pad button {
      touch-action: none;
    }
    a {
      color: inherit;
    }
    #status {
      max-width: 50%;
      font-size: 14px;
    }
    video,
    img {
      max-width: 100%;
    }
    @media (max-width: 680px) {
      .panel {
        display: block;
      }
      aside {
        max-height: 185px;
        overflow: auto;
      }
      .fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .wall {
        min-height: 180px;
      }
      header {
        padding: 12px;
      }
      h1 {
        font-size: 26px;
      }
    }
    .art-library button {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      width: 100%;
      margin: 3px 0;
    }
    .art-thumb {
      width: 68px;
      height: 54px;
      object-fit: cover;
      flex: none;
      border-radius: 3px;
      background: #e3e7e8;
      color: #314756;
      overflow: hidden;
      align-content: center;
      text-align: center;
    }
    .art-library small {
      display: block;
      font-size: 12px;
      margin-top: 4px;
    }
    .art-library strong {
      overflow-wrap: anywhere;
    }
    #art-preview {
      display: grid;
      place-items: center;
      background: #e9edec;
      border-radius: 6px;
      padding: 12px;
    }
    .art-large {
      display: block;
      max-width: 100%;
      max-height: 44vh;
      object-fit: contain;
      white-space: pre-wrap;
    }
    .art-library {
      max-height: 65vh;
      overflow: auto;
    }
    @media (max-width: 680px) {
      .art-library {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        max-height: 260px;
      }
      .art-library button {
        display: grid;
        align-content: start;
        padding: 5px;
      }
      .art-thumb {
        width: 100%;
        height: 76px;
      }
      .art-large {
        max-height: 32vh;
      }
    }
    .walk-stick {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #24384780;
      touch-action: none;
    }
    .walk-knob {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
    }
  
#stage .camera-keys {display:grid;grid-template-columns:repeat(4,44px);gap:2px;position:absolute;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2}
#stage .camera-keys button{padding:0;min-height:44px;border:1px solid #ffffff50;border-radius:5px;background:#20302ee6;color:white;font:14px system-ui;touch-action:none;user-select:none;-webkit-user-select:none}
#stage .camera-keys button.pressed{background:#51695d;border-color:white}
</style>
  <header>
    <strong>虛擬策展工作室</strong
    ><span id="status" role="status">尚未登入</span>
    <button id="logout" hidden>登出</button>
  </header>
  <main>
    <div id="login">
      <h1>線上策展工作室</h1>
      <p>使用策展帳號登入，管理私人作品與展覽。</p>
      <button id="account" class="action">使用 GitHub 帳號登入</button>
      <p>同一分頁重新整理後可繼續工作，登入最長有效八小時。</p>
      <details>
        <summary>擁有者設定與備援登入</summary>
        <p><a href="./register.html">設定 GitHub 登入應用程式</a></p>
        <label
          >既有 GitHub 管理憑證<input
            id="key"
            type="password"
            autocomplete="off"
            spellcheck="false" /></label
        ><button id="signin">使用既有憑證登入</button>
      </details>
    </div>
    <nav id="tabs"></nav>
    <div id="app"></div>
  </main>
  <dialog id="preview">
    <button id="closePreview">返回布展</button
    ><iframe title="草稿預覽"></iframe>
  </dialog>
  <script type="module" src="./login.js"></script>
</html>
